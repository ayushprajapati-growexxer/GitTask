<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section about">
                <h3>About Us</h3>
                <p>We are a leading online shopping platform offering the best products at great prices.</p>
            </div>

            <div class="footer-section customer-service">
                <h3>Customer Service</h3>
                <ul>
                    <li><a href="#">Contact Us</a></li>
                    <li><a href="#">Return Policy</a></li>
                    <li><a href="#">Shipping Information</a></li>
                    <li><a href="#">FAQ</a></li>
                </ul>
            </div>

            <div class="footer-section social">
                <h3>Follow Us</h3>
                <ul>
                    <li><a href="#" target="_blank" class="social-icon facebook">Facebook</a></li>
                    <li><a href="#" target="_blank" class="social-icon twitter">Twitter</a></li>
                    <li><a href="#" target="_blank" class="social-icon instagram">Instagram</a></li>
                    <li><a href="#" target="_blank" class="social-icon youtube">YouTube</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 YourShop | All Rights Reserved</p>
        </div>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
