
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Shopping Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    

    .products, .cart {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 50%;
    }

    .product, .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    button {
      padding: 5px 10px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }

    .add-btn {
      background: #28a745;
      color: white;
    }

    .remove-btn {
      background: #dc3545;
      color: white;
    }

    .qty-btn {
      background: #007bff;
      color: white;
      margin: 0 5px;
    }

    .total {
      font-weight: bold;
      text-align: right;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>🛒 Shopping Cart</h1>

<div class="container">
  <!-- PRODUCTS -->
  <div class="products">
    <h2>Products</h2>

    <div class="product">
      <span>Apple 🍎 - ₹50</span>
      <button class="add-btn" onclick="addToCart('Apple', 50)">Add</button>
    </div>

    <div class="product">
      <span>Banana 🍌 - ₹30</span>
      <button class="add-btn" onclick="addToCart('Banana', 30)">Add</button>
    </div>

    <div class="product">
      <span>Orange 🍊 - ₹40</span>
      <button class="add-btn" onclick="addToCart('Orange', 40)">Add</button>
    </div>
  </div>

  <!-- CART -->
  <div class="cart">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <div class="total">Total: ₹<span id="total">0</span></div>
  </div>
</div>

<script>
  let cart = [];

  function addToCart(name, price) {
    const item = cart.find(p => p.name === name);

    if (item) {
      item.qty++;
    } else {
      cart.push({ name, price, qty: 1 });
    }

    renderCart();
  }

  function removeFromCart(name) {
    cart = cart.filter(item => item.name !== name);
    renderCart();
  }

  function changeQty(name, amount) {
    const item = cart.find(p => p.name === name);
    item.qty += amount;

    if (item.qty <= 0) {
      removeFromCart(name);
    }

    renderCart();
  }

  function renderCart() {
    const cartItems = document.getElementById("cart-items");
    const totalElement = document.getElementById("total");

    cartItems.innerHTML = "";
    let total = 0;

    cart.forEach(item => {
      total += item.price * item.qty;

      cartItems.innerHTML += `
        <div class="cart-item">
          <span>${item.name} (₹${item.price})</span>
          <div>
            <button class="qty-btn" onclick="changeQty('${item.name}', -1)">-</button>
            ${item.qty}
            <button class="qty-btn" onclick="changeQty('${item.name}', 1)">+</button>
            <button class="remove-btn" onclick="removeFromCart('${item.name}')">Remove</button>
          </div>
        </div>
      `;
    });

    totalElement.innerText = total;
  }
</script>

</body>
</html>
